name: イベントのデータを配信

on:
  schedule:
    - cron: '12,42 * * * *'   # 30分ごと。毎時0・30分は混んで遅れやすいのでずらしてある
  workflow_dispatch:          # Actions の画面の「Run workflow」で今すぐ実行（変更がなくても配信する）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 へ順に切り替わる。開催（11/14・15）の前後に動く環境が変わらないよう、24.04 に固定（開催後に latest へ戻してよい）
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Pages は配信のたびにサイト全体を置き換えるので、フード・タイムテーブルなどを足すときも、
      # 別のワークフローにせず、この site フォルダーに一緒に書き出す
      - id: convert
        name: ワークショップ・フード・タイムテーブルをスプレッドシートから取得して変換
        env:
          WS_CSV_URL: ${{ secrets.WS_CSV_URL }}
          FOOD_CSV_URL: ${{ secrets.FOOD_CSV_URL }}
          TT_CSV_URL: ${{ secrets.TT_CSV_URL }}
          PAGES_URL: https://designfesta-jp.github.io/df-event-data/
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/build.mjs site
      # どの一覧も前回から変わっていなければ配信しない（手動実行のときは必ず配信する）
      - if: steps.convert.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - if: steps.convert.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        if: steps.convert.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
